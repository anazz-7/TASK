  let list = isManagerPlus() ? cache.tasks : cache.tasks.filter(t=>t.assigned_to===session.staffId);
  if(taskFilter.staffId) list = list.filter(t=>t.assigned_to===taskFilter.staffId);
  if(taskFilter.priority) list = list.filter(t=>t.priority===taskFilter.priority);
  if(taskFilter.search) list = list.filter(t=>t.title.toLowerCase().includes(taskFilter.search.toLowerCase()));
  const pending = list.filter(t=>t.status!=='done');
  const done = list.filter(t=>t.status==='done');
  const row = (t) => `
    <div class="row-card ${isOverdue(t)?'overdue':''}">
      <div class="row-main">
        <div class="meta"><span>${esc(staffName(t.assigned_to))}</span>${t.due_date?`<span>${fmtDue(t)}</span>`:''}</div>
        <h3><span class="status-dot ${t.status==='done'?'green':'red'}"></span>${esc(t.title)}</h3>
        ${t.notes?`<div class="notes">${esc(t.notes)}</div>`:''}
        <div style="margin-top:8px;">
          <span class="stamp ${t.priority}">${t.priority}</span>
          <span class="stamp ${t.status}">${t.status}</span>
          ${isOverdue(t)?`<span class="stamp overdue-badge">overdue</span>`:''}
        </div>
      </div>
      <div class="row-actions" style="display:flex;align-items:center;gap:6px;">
        ${t.status!=='done'?`<button class="icon-btn" style="font-weight:600;color:var(--leaf);" onclick="window.__markDone('${t.id}')">${icon('check',14)} Done</button>`:''}
        <div class="action-dropdown-holder">
          <button class="action-more-btn" onclick="window.__toggleActionMenu(event, '${t.id}')">More ▾</button>
          <div class="action-dropdown-menu" id="actionMenu_${t.id}">
            ${isManagerPlus()?`<button onclick="window.__editTask('${t.id}')">✎ Edit</button>`:''}
            ${isManagerPlus()?`<button onclick="window.__sendWa('${t.id}')">💬 WhatsApp</button>`:''}
            ${isManagerPlus()?`<button onclick="window.__sendSms('${t.id}')">📲 SMS</button>`:''}
            ${isOwner()?`<button class="danger" onclick="window.__deleteTask('${t.id}')">🗑 Delete</button>`:''}
          </div>
        </div>
      </div>
    </div>`;
  const doneRowCollapsed = (t) => `
    <div class="row-card collapse-row" style="padding:10px 14px;" onclick="window.__toggleDone('${t.id}')">
      <div class="row-main" style="display:flex;align-items:center;gap:0;">
        <span class="collapse-arrow">▸</span>
        <span class="status-dot green"></span>
        <h3 style="font-size:0.88rem;font-weight:500;color:var(--ink-soft);margin:0;">${esc(t.title)}</h3>
      </div>
    </div>`;
  const doneRow = (t) => expandedDoneIds.has(t.id)
    ? `<div class="row-card collapse-row" style="padding:8px 14px;" onclick="window.__toggleDone('${t.id}')">
         <span class="collapse-arrow open">▸</span><span style="font-size:0.75rem;color:var(--ink-soft);">Tap to collapse</span>
       </div>
       ${row(t)}`
    : doneRowCollapsed(t);
  const filterBar = isManagerPlus() ? `
    <div class="row-card" style="flex-direction:column;align-items:stretch;background:transparent;border-style:dashed;">
      <div class="two-col">
        <div><label style="margin-top:0;">Staff</label>
          <select id="filterStaff" onchange="window.__setTaskFilter()">
            <option value="">All staff</option>
            ${cache.staff.map(s=>`<option value="${s.id}" ${taskFilter.staffId===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}
          </select>
        </div>
        <div><label style="margin-top:0;">Priority</label>
          <select id="filterPriority" onchange="window.__setTaskFilter()">
            <option value="">All priorities</option>
            <option value="high" ${taskFilter.priority==='high'?'selected':''}>High</option>
            <option value="medium" ${taskFilter.priority==='medium'?'selected':''}>Medium</option>
            <option value="low" ${taskFilter.priority==='low'?'selected':''}>Low</option>
          </select>
        </div>
      </div>
      <label>Search title</label>
      <input id="filterSearch" placeholder="Type to search..." value="${esc(taskFilter.search)}" oninput="window.__setTaskFilter()">
    </div>` : '';
  const quickBar = isManagerPlus() ? `
    <div class="row-card" style="flex-direction:column;align-items:stretch;background:var(--paper);border:1.5px solid var(--turmeric-dark);margin-bottom:14px;padding:12px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
        <span style="font-weight:700;font-size:0.85rem;color:var(--turmeric-dark);">⚡ Quick Add Task via Natural Text</span>
        <span style="font-size:0.7rem;color:var(--ink-soft);">Try: "Clean store tomorrow @Anas !high"</span>
      </div>
      <div style="display:flex;gap:6px;">
        <input id="quickTaskInput" placeholder="Type task title, @Staff, !priority, due date..." onkeypress="if(event.key==='Enter') window.__quickAddNaturalTask()" style="flex:1;font-size:0.88rem;">
        <button class="stamp-btn" style="padding:8px 14px;font-size:0.85rem;" onclick="window.__quickAddNaturalTask()">+ Add</button>
      </div>
    </div>
  ` : '';

  body.innerHTML = `
    <!-- Tasks Sub-Menu Navigation Bar -->
    <div style="display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;">
      <button class="stamp-btn small ${taskSubTab==='active'?'':'ghost'}" onclick="window.__setTaskSubTab('active')">⚡ Active Tasks (${pending.length})</button>
      <button class="stamp-btn small ${taskSubTab==='history'?'':'ghost'}" onclick="window.__setTaskSubTab('history')">📜 Task History (${done.length})</button>
    </div>

    ${taskSubTab === 'active' ? `
      ${quickBar}
      ${filterBar}
      <div class="section-label">Open Active Tasks ${isManagerPlus()?`<a onclick="window.__sendAllPending()">Send all pending &rarr;</a>`:''}</div>
      ${pending.length ? pending.map(row).join('') : `<div class="empty">No open tasks right now. Great job!</div>`}
    ` : ''}

    ${taskSubTab === 'history' ? `
      <div class="section-label">Completed Task History (${done.length} tasks)</div>
      ${done.length ? done.map(row).join('') : `<div class="empty">No completed tasks in history yet.</div>`}
    ` : ''}

    <div id="taskModalHolder"></div>`;

  window.__toggleDone = (id) => {
    if(expandedDoneIds.has(id)) expandedDoneIds.delete(id); else expandedDoneIds.add(id);
    renderTabBody();
  };

  window.__setTaskFilter = () => {
    const searchEl = document.getElementById('filterSearch');
    const hadFocus = document.activeElement === searchEl;
    const cursorPos = hadFocus ? searchEl.selectionStart : null;
    taskFilter.staffId = document.getElementById('filterStaff').value;
    taskFilter.priority = document.getElementById('filterPriority').value;
    taskFilter.search = searchEl.value;
    renderTabBody();
    if(hadFocus){ const n=document.getElementById('filterSearch'); if(n){ n.focus(); n.setSelectionRange(cursorPos,cursorPos); } }
  };
  window.__sendAllPending = () => {
    const sendable = cache.tasks.filter(t=>t.status!=='done' && staffPhone(t.assigned_to));
    if(!sendable.length){ alert('No pending tasks with a WhatsApp number to send.'); return; }
    if(!confirm(`Open WhatsApp for ${sendable.length} pending task(s)? Allow pop-ups if asked.`)) return;
    sendable.forEach(async t => { window.open(waLink(t), '_blank'); await supabase.from('tasks').update({status:'sent'}).eq('id', t.id); });
    setTimeout(async ()=>{ await loadData(); renderTabBody(); }, 800);
  };
  window.__sendWa = async (id) => {
    const t = cache.tasks.find(x=>x.id===id);
    if(!staffPhone(t.assigned_to)){ alert('No WhatsApp number on file for this person. Add one in Staff.'); return; }
    window.open(waLink(t), '_blank');
    if(t.status!=='done'){ await supabase.from('tasks').update({status:'sent'}).eq('id', id); await loadData(); renderTabBody(); }
  };
  window.__sendSms = async (id) => {
    const t = cache.tasks.find(x=>x.id===id);
    if(!staffPhone(t.assigned_to)){ alert('No phone number on file for this person. Add one in Staff.'); return; }
    window.location.href = smsLink(t);
    if(t.status!=='done'){ await supabase.from('tasks').update({status:'sent'}).eq('id', id); await loadData(); renderTabBody(); }
  };
  window.__editTask = (id) => openTaskModal(id);
}

// __markDone defined GLOBALLY so it always works regardless of active tab
window.__markDone = function(id) {
  const t = cache.tasks.find(x => x.id === id);
  if (!t) return;

  // Instant local update
  t.status = 'done';
  t.completed_at = new Date().toISOString();
  _tasksSave();
  celebrateDone();
  window.showToast('✓ Task done! Moved to Task History.', 'success');
  logAuditEvent('Task Completed', 'Completed: ' + t.title);

  // Re-render immediately — switch to history to show where it went
  if (activeTab === 'tasks') {
    renderTabBody();
  }

  // Background DB sync (non-blocking)
  if (navigator.onLine && typeof supabase !== 'undefined' && !String(id).startsWith('loc_task_')) {
    Promise.resolve(supabase.from('tasks').update({ status: 'done' }).eq('id', id)).catch(() => {});
  }
  try { awardTaskPoint(id, 'task').catch(() => {}); } catch(e){}
  try { notifyCompletion(id, 'task'); } catch(e){}
};

function openTaskModal(taskId){
  const t = taskId ? cache.tasks.find(x=>x.id===taskId) : null;
  const holder = document.getElementById('taskModalHolder');
  const assignField = isManagerPlus()
    ? `<label>Assign to</label><select id="mTaskStaff">${cache.staff.map(s=>`<option value="${s.id}" ${t&&t.assigned_to===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select>`
    : `<label>Assign to</label><input value="${esc(session.name)}" disabled><input type="hidden" id="mTaskStaff" value="${session.staffId}">`;
  holder.innerHTML = `
  <div class="overlay show"><div class="modal">
    <h2>${t?'Edit task':'New task'}</h2>
    ${assignField}
    <label>Title</label>
    <input id="mTaskTitle" value="${t?esc(t.title):''}" placeholder="e.g. Restock shelf">
    <label>Details</label>
    <textarea id="mTaskNotes" placeholder="Optional">${t?esc(t.notes||''):''}</textarea>
    <div class="two-col">
      <div><label>Due date</label><input type="date" id="mTaskDate" value="${t?t.due_date||'':''}"></div>
      <div><label>Due time</label><input type="time" id="mTaskTime" value="${t?t.due_time||'':''}"></div>
    </div>
    <label>Priority</label>
    <select id="mTaskPriority">
      <option value="low" ${t&&t.priority==='low'?'selected':''}>Low</option>
      <option value="medium" ${!t||t.priority==='medium'?'selected':''}>Medium</option>
      <option value="high" ${t&&t.priority==='high'?'selected':''}>High</option>
    </select>
    <div class="modal-actions">
      <button class="stamp-btn ghost" onclick="window.__closeModal()">Cancel</button>
      <button class="stamp-btn" onclick="window.__saveTask('${taskId||''}')">Save</button>
    </div>
  </div></div>`;
  window.__closeModal = () => { holder.innerHTML=''; };
  window.__saveTask = (id) => {
    const title = document.getElementById('mTaskTitle').value.trim();
    if (!title) { alert('Give the task a title.'); return; }
    const data = {
      business_id: session.businessId,
      assigned_to: document.getElementById('mTaskStaff').value,
      created_by: session.staffId,
      title,
      notes: document.getElementById('mTaskNotes').value.trim(),
      due_date: document.getElementById('mTaskDate').value || null,
      due_time: document.getElementById('mTaskTime').value || null,
      priority: document.getElementById('mTaskPriority').value,
    };

    // Instant local update
    const locId = id || ('loc_task_' + Date.now());
    if (id) {
      const ex = cache.tasks.find(x => x.id === id);
      if (ex) Object.assign(ex, data);
    } else {
      data.id = locId;
      data.status = 'pending';
      data.created_at = new Date().toISOString();
      cache.tasks.unshift(data);
    }
    _tasksSave();
    holder.innerHTML = '';
    window.showToast(id ? 'Task updated!' : 'Task created!', 'success');
    _tasksRender();

    // Background DB sync
    if (navigator.onLine && typeof supabase !== 'undefined') {
      if (id && !String(id).startsWith('loc_task_')) {
        Promise.resolve(supabase.from('tasks').update(data).eq('id', id)).catch(() => {});
      } else {
        const db = Object.assign({}, data);
        delete db.id;
        supabase.from('tasks').insert(db).select().single().then(r => {
          if (r && r.data && r.data.id) {
            const loc = cache.tasks.find(t => t.id === locId);
            if (loc) { Object.assign(loc, r.data); _tasksSave(); }
          }
        }).catch(() => {});
      }
    }
  };
}
window.__openTask = () => openTaskModal(null);

/* ---------------- DAILY (recurring routine tasks) ---------------- */
let expandedRoutineIds = new Set();
function renderDailyTab(body){
  const today = todayStr();
  let list = isManagerPlus() ? cache.routines : cache.routines.filter(r=>r.assigned_to===session.staffId);
  const row = (r) => {
    const log = cache.routineLog.find(l=>l.routine_id===r.id);
    const done = log && log.status==='done';
    return `
    <div class="row-card">
      <div class="row-main">
        <div class="meta"><span>${esc(staffName(r.assigned_to))}</span>${r.due_time?`<span>Reminder: ${r.due_time.slice(0,5)}</span>`:''}</div>
        <h3><span class="status-dot ${done?'green':'red'}"></span>${esc(r.title)}</h3>
        ${r.notes?`<div class="notes">${esc(r.notes)}</div>`:''}
        <div style="margin-top:8px;">
          <span class="stamp ${r.priority}">${r.priority}</span>
          <span class="stamp ${done?'done':'pending'}">${done?'done today':'pending today'}</span>
        </div>
      </div>
      <div class="row-actions">
        <button class="stamp-btn small ${done?'ghost':''}" onclick="window.__toggleRoutine('${r.id}', ${done})">${done?'Undo':icon('check',14)+' Done today'}</button>
        
        <div class="action-dropdown-holder">
    <button class="action-more-btn" onclick="window.__toggleActionMenu(event, '${r.id}')">More ▾</button>
    <div class="action-dropdown-menu" id="actionMenu_${r.id}">
      ${isManagerPlus() ? `<button onclick="window.__editRoutine('${r.id}')">✎ Edit</button>` : ''}
      ${isOwner() ? `<button class="danger" onclick="window.__deleteRoutine('${r.id}')">🗑 Delete</button>` : ''}
    </div>
  </div>
      </div>
    </div>`;
  };
  const collapsedRow = (r) => `
    <div class="row-card collapse-row" style="padding:10px 14px;" onclick="window.__toggleRoutineExpand('${r.id}')">
      <div class="row-main" style="display:flex;align-items:center;">
        <span class="collapse-arrow">▸</span>
        <span class="status-dot green"></span>
        <h3 style="font-size:0.88rem;font-weight:500;color:var(--ink-soft);margin:0;">${esc(r.title)}</h3>
      </div>
    </div>`;
  const doneWrap = (r) => expandedRoutineIds.has(r.id)
    ? `<div class="row-card collapse-row" style="padding:8px 14px;" onclick="window.__toggleRoutineExpand('${r.id}')">
         <span class="collapse-arrow open">▸</span><span style="font-size:0.75rem;color:var(--ink-soft);">Tap to collapse</span>
       </div>
       ${row(r)}`
    : collapsedRow(r);

  const pending = list.filter(r=>{ const l=cache.routineLog.find(x=>x.routine_id===r.id); return !(l && l.status==='done'); });
  const doneList = list.filter(r=>{ const l=cache.routineLog.find(x=>x.routine_id===r.id); return l && l.status==='done'; });

  body.innerHTML = `
    
    <div class="section-label">
      <span>Everyday schedule — ${today}</span>
      <div style="display:inline-flex;align-items:center;gap:6px;">
        <svg width="22" height="22" viewBox="0 0 36 36" style="transform:rotate(-90deg);vertical-align:middle;">
          <path d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="var(--paper-line)" stroke-width="4" />
          <path d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="var(--leaf)" stroke-width="4" stroke-dasharray="${list.length ? Math.round((doneList.length / list.length) * 100) : 0}, 100" />
        </svg>
        <span style="font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:0.8rem;color:var(--leaf);">${list.length ? Math.round((doneList.length / list.length) * 100) : 0}%</span>
        <span style="color:var(--ink-soft);font-size:0.75rem;">(${doneList.length}/${list.length})</span>
      </div>
    </div>
    ${pending.length ? pending.map(row).join('') : (list.length ? '' : `<div class="empty">No everyday tasks set up yet.${isManagerPlus()?' Tap + to add one — it repeats automatically every day.':''}</div>`)}
    ${doneList.length ? `<div class="section-label">Done today <span style="color:var(--ink-soft);font-weight:600;">tap to expand</span></div>${doneList.map(doneWrap).join('')}` : ''}
    <div id="routineModalHolder"></div>
  `;
  window.__toggleRoutineExpand = (id) => {
    if(expandedRoutineIds.has(id)) expandedRoutineIds.delete(id); else expandedRoutineIds.add(id);
    renderTabBody();
  };
  window.__toggleRoutine = async (routineId, currentlyDone) => {
    const key = 'routine-'+routineId;
    if(__busyKeys.has(key)) return;
    __busyKeys.add(key);
    try{
      const newStatus = currentlyDone ? 'pending' : 'done';
      const existing = cache.routineLog.find(l=>l.routine_id===routineId);
      if(existing) await sbCheck(supabase.from('routine_log').update({status:newStatus}).eq('id', existing.id));
      else await sbCheck(supabase.from('routine_log').insert({routine_id: routineId, date: today, status: newStatus}));
      if(newStatus==='done'){
        celebrateDone();
        await awardTaskPoint(routineId, 'routine');
        notifyCompletion(routineId, 'routine');
      }
      await loadData(); renderTabBody();
    } catch(e){
      alert('Could not update — please check your connection and try again.\n\n('+(e.message||e)+')');
    } finally { __busyKeys.delete(key); }
  };
  window.__deleteRoutine = function(id) {
  window.__showDeleteConfirm({
    title: 'Delete routine task?',
    message: 'This removes it for everyone on this business. It cannot be undone.',
    onConfirm: async () => {
      showLoading();
      try {
        await supabase.from('routines').delete().eq('id', id);
        cache.routines = cache.routines.filter(r => r.id !== id);
      } catch(e){}
      finally {
        hideLoading();
        await loadData();
        renderTabBody();
      }
    }
  });
};
  window.__editRoutine = (id) => openRoutineModal(id);
}
function openRoutineModal(routineId){
  const r = routineId ? cache.routines.find(x=>x.id===routineId) : null;
  const holder = document.getElementById('routineModalHolder');
  holder.innerHTML = `
  <div class="overlay show"><div class="modal">
    <h2>${r?'Edit everyday task':'New everyday task'}</h2>
    <p style="font-size:0.82rem;color:var(--ink-soft);margin:0;">This repeats automatically every day — no need to recreate it. Mark it done each day from the Daily tab.</p>
    <label>Assign to</label>
    <select id="mRoutineStaff">${cache.staff.map(s=>`<option value="${s.id}" ${r&&r.assigned_to===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select>
    <label>Title</label>
    <input id="mRoutineTitle" value="${r?esc(r.title):''}" placeholder="e.g. Open the shop shutters">
    <label>Details</label>
    <textarea id="mRoutineNotes" placeholder="Optional">${r?esc(r.notes||''):''}</textarea>
    <label>Reminder time (optional)</label>
    <input type="time" id="mRoutineTime" value="${r?r.due_time||'':''}">
    <small class="hint">If set, a reminder notification tries to fire around this time while the app is open (see Settings for how alerts work).</small>
    <label>Priority</label>
    <select id="mRoutinePriority">
      <option value="low" ${r&&r.priority==='low'?'selected':''}>Low</option>
      <option value="medium" ${!r||r.priority==='medium'?'selected':''}>Medium</option>
      <option value="high" ${r&&r.priority==='high'?'selected':''}>High</option>
    </select>
    <div class="modal-actions">
      <button class="stamp-btn ghost" onclick="window.__closeRoutineModal()">Cancel</button>
      <button class="stamp-btn" onclick="window.__saveRoutine('${routineId||''}')">Save</button>
    </div>
  </div></div>`;
  window.__closeRoutineModal = () => { holder.innerHTML=''; };
  window.__saveRoutine = async (id) => {
    const title = document.getElementById('mRoutineTitle').value.trim();
    if(!title){ alert('Give it a title.'); return; }
    const data = {
      business_id: session.businessId,
      assigned_to: document.getElementById('mRoutineStaff').value,
      title,
      notes: document.getElementById('mRoutineNotes').value.trim(),
      due_time: document.getElementById('mRoutineTime').value || null,
      priority: document.getElementById('mRoutinePriority').value,
    };
    await guardedSave('routineForm-'+(id||'new'), async () => {
      if(id) await sbCheck(supabase.from('routines').update(data).eq('id', id));
      else await sbCheck(supabase.from('routines').insert(data));
      holder.innerHTML='';
      await loadData(); renderTabBody();
    });
  };
}
window.__openRoutine = () => openRoutineModal(null);

function timeStr(iso){ return new Date(iso).toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'}); }
function getLocation(){
  return new Promise((resolve) => {
    if(!navigator.geolocation){ resolve(null); return; }
    navigator.geolocation.getCurrentPosition(
      (pos) => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
      (err) => {
        navigator.geolocation.getCurrentPosition(
          (pos2) => resolve({ lat: pos2.coords.latitude, lng: pos2.coords.longitude }),
          () => resolve(null),
          { enableHighAccuracy: false, timeout: 8000, maximumAge: 0 }
        );
      },
      { enableHighAccuracy: true, timeout: 8000, maximumAge: 10000 }
    );
  });
}
function mapLink(lat, lng){ return `https://www.google.com/maps?q=${lat},${lng}`; }

/* ---------------- celebration + auto incentive point on completion ---------------- */
function playOpenChime(){
  const ctx = getAudioCtx();
  if(!ctx) return;
  try{
    if(ctx.state === 'suspended') ctx.resume();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = 'sine'; o.frequency.setValueAtTime(660, ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15);
    g.gain.setValueAtTime(0.001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.09, ctx.currentTime + 0.03);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.32);
    o.start(); o.stop(ctx.currentTime + 0.34);
  } catch(e){}
}
function playSuccessChime(){
  const ctx = getAudioCtx();
  if(!ctx) return;
  try{
    if(ctx.state === 'suspended') ctx.resume();
    const notes = [523.25, 659.25, 783.99, 1046.50]; // C5-E5-G5-C6, a bright little fanfare
    notes.forEach((freq, i) => {
      const start = ctx.currentTime + i*0.09;
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type = 'triangle'; o.frequency.value = freq;
      g.gain.setValueAtTime(0.001, start);
      g.gain.exponentialRampToValueAtTime(0.13, start+0.02);
      g.gain.exponentialRampToValueAtTime(0.001, start+0.28);
      o.start(start); o.stop(start+0.3);
    });
  } catch(e){}
}
function celebrateDone(){
  playSuccessChime();
  const banner = document.createElement('div');
  banner.className = 'celebrate-banner';
  banner.textContent = 'Well done!';
  document.body.appendChild(banner);
  setTimeout(()=>banner.remove(), 1700);
  const colors = ['#D9932E','#3E7C59','#4A5B8C','#B5473A','#6B4FA0'];
  for(let i=0;i<28;i++){
    const c = document.createElement('div');
    c.className = 'confetti-piece';
    c.style.left = Math.random()*100+'vw';
    c.style.background = colors[Math.floor(Math.random()*colors.length)];
    c.style.animationDuration = (1.6+Math.random()*1.1)+'s';
    c.style.animationDelay = (Math.random()*0.25)+'s';
    document.body.appendChild(c);
    setTimeout(()=>c.remove(), 3200);
  }
}
async function awardTaskPoint(itemId, kind){
  let assignedTo, title;
  if(kind==='task'){
    const t = cache.tasks.find(x=>x.id===itemId);
    if(!t) return;
    assignedTo = t.assigned_to; title = t.title;
  } else if(kind==='routine'){
    const r = cache.routines.find(x=>x.id===itemId);
    if(!r) return;
    assignedTo = r.assigned_to; title = r.title;
  } else {
    const w = cache.weeklyTasks.find(x=>x.id===itemId);
    if(!w) return;
    assignedTo = w.assigned_to; title = w.title;
  }
  if(!assignedTo) return;
  await supabase.from('points_log').insert({
    business_id: session.businessId,
    staff_id: assignedTo,
    points: 1,
    reason: `Completed: ${title}`,
    date: todayStr(),
    awarded_by: session.staffId,
  });
}
function computePresenceStreak(staffId){
  let streak = 0;
  let d = new Date();
  // if today isn't marked present yet, start counting from yesterday so a streak in progress still shows
  const todayRec = cache.attendance.find(a=>a.staff_id===staffId && a.date===todayStr());
  if(!todayRec || todayRec.status!=='present') d.setDate(d.getDate()-1);
  while(true){
    const rec = cache.attendance.find(a=>a.staff_id===staffId && a.date===localDateStr(d));
    if(rec && rec.status==='present'){ streak++; d.setDate(d.getDate()-1); }
    else break;
  }
  return streak;
}

function getWeekStartDate(d){

    for(let i=weeksCount-1; i>=0; i--){
      const anchor = new Date(today); anchor.setDate(anchor.getDate() - i*7);
      const weekStart = getWeekStartDate(anchor);
      const weekEnd = new Date(weekStart); weekEnd.setDate(weekEnd.getDate()+6);
      const startKey = localDateStr(weekStart);
      const endKey = localDateStr(weekEnd);
      const total = cache.sales.filter(s=>s.date>=startKey && s.date<=endKey).reduce((sum,s)=>sum+Number(s.order_value||0),0);
      buckets.push({ total, label: weekStart.toLocaleDateString('en-IN',{day:'numeric',month:'short'}) });
    }
  } else {
    const monthsCount = 6;
    for(let i=monthsCount-1; i>=0; i--){
      const d = new Date(today.getFullYear(), today.getMonth()-i, 1);
      const key = localMonthStr(d);
      const total = cache.sales.filter(s=>s.date.startsWith(key)).reduce((sum,s)=>sum+Number(s.order_value||0),0);
      buckets.push({ total, label: d.toLocaleDateString('en-IN',{month:'short',year:'2-digit'}) });
    }
  }
  const max = Math.max(1, ...buckets.map(b=>b.total));
  const periodTotal = buckets.reduce((s,b)=>s+b.total,0);
  const avg = periodTotal / buckets.length;
  const bars = buckets.map(b => `
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;">
      <div style="font-size:0.62rem;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;">${b.total>0?'₹'+Math.round(b.total):''}</div>
      <div style="width:100%;background:var(--turmeric);border-radius:4px 4px 0 0;height:${Math.max(3,(b.total/max)*110)}px;transition:height 0.3s ease;"></div>
      <div style="font-size:0.6rem;color:var(--ink-soft);white-space:nowrap;transform:rotate(-40deg);transform-origin:top left;width:1px;">${b.label}</div>
    </div>`).join('');
  return `
    <div class="section-label">Sales report</div>
    <div class="row-card" style="flex-direction:column;align-items:stretch;">
      <div style="display:flex;gap:6px;margin-bottom:14px;">
        <button class="stamp-btn small ${mode==='weekly'?'':'ghost'}" onclick="window.__setSalesMode('weekly')">Weekly</button>
        <button class="stamp-btn small ${mode==='monthly'?'':'ghost'}" onclick="window.__setSalesMode('monthly')">Monthly</button>
      </div>
      <div style="display:flex;align-items:flex-end;gap:4px;height:140px;padding-bottom:20px;overflow-x:auto;">${bars}</div>
      <div class="two-col" style="margin-top:10px;">
        <div class="kv"><span>Total (${mode==='weekly'?'last 8 weeks':'last 6 months'})</span><b>₹${periodTotal.toFixed(0)}</b></div>
        <div class="kv"><span>${mode==='weekly'?'Weekly':'Monthly'} average</span><b>₹${avg.toFixed(0)}</b></div>
      </div>
    </div>
  `;
}

/* ---------------- LABEL (what was labelled each day) ---------------- */
let expandedLabelDates = new Set([todayStr()]);
let labelReportMode = 'weekly';

function buildQtyGraphHtml(items, mode, setModeGlobalName, unitLabel, valueField, prefix, dateField){
  valueField = valueField || 'qty';
  prefix = prefix || '';
  dateField = dateField || 'date';
  unitLabel = unitLabel || '';
  mode = mode || 'weekly';
  const today = new Date();
  const buckets = [];

  if(mode === 'daily'){
    for(let i=6; i>=0; i--){
      const d = new Date(today); d.setDate(d.getDate() - i);
      const key = localDateStr(d);
      const total = items.filter(x=>x[dateField]===key).reduce((s,x)=>s+Number(x[valueField]||0),0);
      buckets.push({ total, label: d.toLocaleDateString('en-IN',{weekday:'short', day:'numeric'}) });
    }
  } else if(mode === 'weekly'){
    for(let i=7; i>=0; i--){
      const anchor = new Date(today); anchor.setDate(anchor.getDate() - i*7);
      const weekStart = getWeekStartDate(anchor);
      const weekEnd = new Date(weekStart); weekEnd.setDate(weekEnd.getDate()+6);
      const startKey = localDateStr(weekStart), endKey = localDateStr(weekEnd);
      const total = items.filter(x=>x[dateField]>=startKey && x[dateField]<=endKey).reduce((s,x)=>s+Number(x[valueField]||0),0);
      buckets.push({ total, label: weekStart.toLocaleDateString('en-IN',{day:'numeric',month:'short'}) });
    }
  } else {
    for(let i=5; i>=0; i--){
      const d = new Date(today.getFullYear(), today.getMonth()-i, 1);
      const key = localMonthStr(d);
      const total = items.filter(x=>x[dateField] && x[dateField].startsWith(key)).reduce((s,x)=>s+Number(x[valueField]||0),0);
      buckets.push({ total, label: d.toLocaleDateString('en-IN',{month:'short',year:'2-digit'}) });
    }
  }

  const maxVal = Math.max(1, ...buckets.map(b=>b.total));
  const periodTotal = buckets.reduce((s,b)=>s+b.total,0);
  const avg = periodTotal / buckets.length;

  const width = 600;
  const height = 150;
  const paddingX = 40;
  const paddingY = 25;
  const graphW = width - paddingX * 2;
  const graphH = height - paddingY * 2;

  const points = buckets.map((b, i) => {
    const x = paddingX + (i / Math.max(1, buckets.length - 1)) * graphW;
    const y = height - paddingY - (b.total / maxVal) * graphH;
    return { x, y, val: b.total, label: b.label };
  });

  let pathD = `M ${points[0].x} ${points[0].y}`;
  for(let i = 0; i < points.length - 1; i++){
    const curr = points[i];
    const next = points[i+1];
    const cpX1 = curr.x + (next.x - curr.x) / 2;
    const cpY1 = curr.y;
    const cpX2 = curr.x + (next.x - curr.x) / 2;
    const cpY2 = next.y;
    pathD += ` C ${cpX1} ${cpY1}, ${cpX2} ${cpY2}, ${next.x} ${next.y}`;
  }

  const areaD = `${pathD} L ${points[points.length-1].x} ${height - paddingY} L ${points[0].x} ${height - paddingY} Z`;
  const gradId = 'lineGrad_' + Math.random().toString(36).substr(2, 6);

  const svgGraph = `
    <div style="position:relative;width:100%;overflow-x:auto;">
      <svg viewBox="0 0 ${width} ${height}" style="width:100%;height:auto;display:block;min-width:320px;">
        <defs>
          <linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="var(--turmeric)" stop-opacity="0.35"/>
            <stop offset="100%" stop-color="var(--turmeric)" stop-opacity="0.0"/>
          </linearGradient>
        </defs>
        <!-- Horizontal Gridlines -->
        <line x1="${paddingX}" y1="${paddingY}" x2="${width-paddingX}" y2="${paddingY}" stroke="var(--paper-line)" stroke-dasharray="4" stroke-width="1"/>
        <line x1="${paddingX}" y1="${height/2}" x2="${width-paddingX}" y2="${height/2}" stroke="var(--paper-line)" stroke-dasharray="4" stroke-width="1"/>
        <line x1="${paddingX}" y1="${height-paddingY}" x2="${width-paddingX}" y2="${height-paddingY}" stroke="var(--paper-line)" stroke-width="1"/>

        <!-- Gradient Fill -->
        <path d="${areaD}" fill="url(#${gradId})" />

        <!-- Spline Line -->
        <path d="${pathD}" fill="none" stroke="var(--turmeric)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

        <!-- Dots & Data Labels -->
        ${points.map(p=>`
          <circle cx="${p.x}" cy="${p.y}" r="5" fill="#FFFFFF" stroke="var(--turmeric)" stroke-width="3" />
          <text x="${p.x}" y="${p.y - 8}" text-anchor="middle" font-size="10" font-family="'IBM Plex Mono', monospace" font-weight="700" fill="var(--ink)">${p.val > 0 ? prefix + Math.round(p.val) : ''}</text>
          <text x="${p.x}" y="${height - 6}" text-anchor="middle" font-size="9" font-family="'Inter', sans-serif" fill="var(--ink-soft)">${p.label}</text>
        `).join('')}
      </svg>
    </div>
  `;

  return `
    <div class="section-label">${prefix ? 'Revenue Trend' : 'Activity Trend'}</div>
    <div class="row-card" style="flex-direction:column;align-items:stretch;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <div style="display:flex;gap:6px;">
          <button class="stamp-btn small ${mode==='daily'?'':'ghost'}" onclick="window.${setModeGlobalName}('daily')">Daily</button>
          <button class="stamp-btn small ${mode==='weekly'?'':'ghost'}" onclick="window.${setModeGlobalName}('weekly')">Weekly</button>
          <button class="stamp-btn small ${mode==='monthly'?'':'ghost'}" onclick="window.${setModeGlobalName}('monthly')">Monthly</button>
        </div>
        <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.1rem;color:var(--turmeric-dark);">
          ${prefix}${periodTotal.toFixed(0)} ${unitLabel}
        </div>
      </div>
      ${svgGraph}
      <div class="two-col" style="margin-top:14px;border-top:1px solid var(--paper-line);padding-top:10px;">
        <div class="kv"><span>Total (${mode})</span><b>${prefix}${periodTotal.toFixed(0)} ${unitLabel}</b></div>
        <div class="kv"><span>Average per ${mode==='daily'?'day':mode==='weekly'?'week':'month'}</span><b>${prefix}${avg.toFixed(prefix?0:1)} ${unitLabel}</b></div>
      </div>
    </div>
  `;
}

function getStaffLevel(pts){
  if(pts >= 1000) return { level: 5, title: 'Legend', min: 1000, next: 2500, color: 'var(--turmeric-dark)' };
  if(pts >= 500) return { level: 4, title: 'Master Specialist', min: 500, next: 1000, color: '#8B5CF6' };
  if(pts >= 250) return { level: 3, title: 'Pro Performer', min: 250, next: 500, color: '#3B82F6' };
  if(pts >= 100) return { level: 2, title: 'Achiever', min: 100, next: 250, color: '#10B981' };
  return { level: 1, title: 'Rookie', min: 0, next: 100, color: '#64748B' };
}

function calcTargetProgress(target, staffId){
  const curMonth = target.month || monthKey(todayStr());
  let currentVal = 0;
  
  if(target.type === 'sales'){
    currentVal = cache.sales.filter(s=>s.staff_id===staffId && monthKey(s.date)===curMonth).reduce((sum,s)=>sum+Number(s.order_value||0),0);
  } else if(target.type === 'tasks'){
    currentVal = cache.tasks.filter(t=>t.assigned_to===staffId && t.status==='done' && monthKey(t.due_date||t.created_at)===curMonth).length;
  } else if(target.type === 'attendance'){
    currentVal = cache.attendance.filter(a=>a.staff_id===staffId && a.status==='present' && monthKey(a.date)===curMonth).length;
  } else if(target.type === 'packaging'){
    currentVal = cache.packages.filter(p=>p.staff_id===staffId && monthKey(p.date)===curMonth).reduce((sum,p)=>sum+Number(p.qty||0),0);
  } else if(target.type === 'labeling'){
    currentVal = cache.labels.filter(l=>l.staff_id===staffId && monthKey(l.date)===curMonth).reduce((sum,l)=>sum+Number(l.qty||0),0);
  } else {
    currentVal = Number(target.current_val || 0);
  }

  const goal = Number(target.target_val || 1);
  const pct = Math.min(100, Math.round((currentVal / goal) * 100));
  const isDone = currentVal >= goal;
  return { currentVal, goal, pct, isDone, type: target.type };
}

window.__sendAiMessage = () => {
  const input = document.getElementById('aiInput');
  if(!input) return;
  const query = input.value.trim();
  if(!query) return;

  aiAssistantMessages.push({ sender: 'user', text: query });
  input.value = '';
  renderTabBody();

  setTimeout(() => {

    aiAssistantMessages.push({ sender: 'ai', text: reply });
    renderTabBody();
  }, 300);

window.__generateAiReply = (q) => {
  const qLower = q.toLowerCase();
  const curMonth = monthKey(todayStr());
  const today = todayStr();

  if(qLower.includes('today') || qLower.includes('summary')){
    const salesToday = cache.sales.filter(s=>s.date===today).reduce((sum,s)=>sum+Number(s.order_value||0),0);
    const attToday = cache.attendance.filter(a=>a.date===today && a.status==='present').length;
    const tasksDoneToday = cache.tasks.filter(t=>t.status==='done' && (t.due_date===today || t.created_at?.startsWith(today))).length;
    return `Today's Business Snapshot (${today}):\n• Total Sales Logged: ₹${salesToday.toFixed(0)}\n• Staff Present: ${attToday} member(s)\n• Tasks Completed: ${tasksDoneToday} task(s)`;
  }

  if(qLower.includes('top') || qLower.includes('performer') || qLower.includes('best staff')){
    const pointsByStaff = {};
    cache.points.forEach(p=> { pointsByStaff[p.staff_id] = (pointsByStaff[p.staff_id]||0) + Number(p.points||0); });
    const topId = Object.keys(pointsByStaff).sort((a,b)=>pointsByStaff[b]-pointsByStaff[a])[0];
    if(topId){
      return `Top Staff Performer is ${staffName(topId)} with ${pointsByStaff[topId]} incentive points!`;
    }
    return `Currently all staff members are working well! Check the Points & Incentives tab for full leaderboard rankings.`;
  }

  if(qLower.includes('credit') || qLower.includes('pending') || qLower.includes('due')){
    const totalCredit = cache.dailyAccounts.reduce((sum,a)=>sum + Number(a.credit||0) - Number(a.credit_received||0), 0);
    return `Net Outstanding Customer Credit: ₹${Math.max(0, totalCredit).toFixed(0)}.\n\nTip: You can track and collect outstanding credit in the Accounts tab!`;
  }

  if(qLower.includes('forecast') || qLower.includes('revenue') || qLower.includes('sales')){
    const monthSales = cache.sales.filter(s=>monthKey(s.date)===curMonth).reduce((sum,s)=>sum+Number(s.order_value||0),0);
    const daysPassed = new Date(today).getDate();
    const totalDays = new Date(new Date().getFullYear(), new Date().getMonth()+1, 0).getDate();
    const proj = daysPassed ? Math.round((monthSales / daysPassed) * totalDays) : 0;
    return `Month Sales so far: ₹${monthSales.toFixed(0)}.\nDaily Average: ₹${(daysPassed ? Math.round(monthSales/daysPassed) : 0)}/day.\nProjected Month-End Sales: ₹${proj.toFixed(0)}.`;
  }

  return `Here is your AI Business Analysis:\n\n• Monthly Revenue: ₹${cache.sales.filter(s=>monthKey(s.date)===curMonth).reduce((sum,s)=>sum+Number(s.order_value||0),0).toFixed(0)}\n• Staff Present Today: ${cache.attendance.filter(a=>a.date===today && a.status==='present').length}\n• Pending Tasks: ${cache.tasks.filter(t=>t.status!=='done').length}\n\nAsk me specifically about sales, staff, tasks, or credit!`;
};

function buildAttendanceGridHtml(from, to){
  const start = new Date(from), end = new Date(to);
  const dayCount = Math.round((end-start)/86400000) + 1;
  if(dayCount > 31){
    return `<div class="empty">Pick a range of 31 days or less to see the day-by-day tick/cross grid (currently ${dayCount} days).</div>`;
  }
  if(dayCount < 1 || !cache.staff.length) return `<div class="empty">No data for this range.</div>`;
  const dates = [];
  for(let i=0;i<dayCount;i++){ const d=new Date(start); d.setDate(d.getDate()+i); dates.push(localDateStr(d)); }
  const cellStyle = 'padding:6px 8px;text-align:center;font-size:0.85rem;border-bottom:1px solid var(--paper-line);';
  const headStyle = 'padding:6px 8px;text-align:center;font-size:0.65rem;font-family:\'IBM Plex Mono\',monospace;color:var(--ink-soft);white-space:nowrap;border-bottom:1.5px solid var(--paper-line);';
  const rows = cache.staff.map(s=>{
    const cells = dates.map(d=>{
      const present = cache.attendance.some(a=>a.staff_id===s.id && a.date===d && a.status==='present');
      return `<td style="${cellStyle}">${present?'<span style="color:var(--leaf);font-weight:700;">✓</span>':'<span style="color:var(--brick);">✗</span>'}</td>`;
    }).join('');
    return `<tr><td style="${cellStyle}text-align:left;font-weight:600;white-space:nowrap;">${esc(s.name)}</td>${cells}</tr>`;
  }).join('');
  const headerCells = dates.map(d=>`<th style="${headStyle}">${d.slice(5)}</th>`).join('');
  return `<div class="row-card" style="overflow-x:auto;display:block;">
    <table style="border-collapse:collapse;width:100%;">
      <thead><tr><th style="${headStyle}text-align:left;">Staff</th>${headerCells}</tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

    renderTabBody();
  };
  window.__exportReportCsv = () => {
    const lines = [`Report period,${from},to,${to}`, ''];
    lines.push('Attendance', 'Name,Days Present,Days Absent');
    attRows.forEach(r=>lines.push(`${r.name},${r.daysPresent},${r.daysAbsent}`));
    lines.push('', 'Tasks', 'Name,Assigned,Completed,Overdue,Completion Rate');
    taskRows.forEach(r=>lines.push(`${r.name},${r.assigned},${r.done},${r.overdue},${r.rate}%`));
    lines.push('', 'Sales', 'Name,Orders,Total');
    salesRows.forEach(r=>lines.push(`${r.name},${r.orders},${r.total.toFixed(2)}`));
    lines.push('', 'Points', 'Name,Total');
    pointsRows.forEach(r=>lines.push(`${r.name},${r.total}`));
    const blob = new Blob([lines.join('\n')], {type:'text/csv'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `report-${from}-to-${to}.csv`;

function calcAccTotals(data) {
  const f = data || {};
  const totalSales = Number(f.total_sales || 0);
  const total = Number(f.amount || 0) + Number(f.vendors || 0) + Number(f.credit || 0) - Number(f.credit_received || 0) + Number(f.gpay || 0) + Number(f.ba_credit || 0) + Number(f.expenses || 0) + Number(f.personal_ac || 0) + Number(f.salary_paid || 0) + Number(f.adjustment || 0);
  const excess = total > totalSales ? total - totalSales : 0;
  const less = totalSales > total ? totalSales - total : 0;
  return { totalSales, total, excess, less };
}

function getAuditLogs() {
  if (cache && cache.auditLogs && cache.auditLogs.length) {
    return cache.auditLogs;
  }
  try {
    return JSON.parse(localStorage.getItem('br_audit_logs_' + session.businessId) || '[]');
  } catch(e) { return []; }
}

function logAuditEvent(actionType, details) {
  if (!session) return;
  const entry = {
    id: 'audit_' + Date.now() + '_' + Math.random().toString(36).substring(2,6),
    business_id: session.businessId,
    staff_id: session.staffId,
    staff_name: session.name || 'Staff',
    staff_role: session.role || 'staff',
    action_type: actionType,
    details: details,
    timestamp: new Date().toISOString()
  };
  
  if (!cache.auditLogs) cache.auditLogs = [];
  cache.auditLogs.unshift(entry);
  if (cache.auditLogs.length > 500) cache.auditLogs.pop();
  
  try {
    localStorage.setItem('br_audit_logs_' + session.businessId, JSON.stringify(cache.auditLogs));
  } catch(e){}

  // Sync to central Supabase DB asynchronously so ALL STAFF logs are captured
  if (typeof supabase !== 'undefined' && session.businessId) {
    Promise.resolve(supabase.from('audit_logs').insert(entry)).catch(()=>{});
  }
}

    playReminderSound();
  }
  if (typeof showNotification === 'function') {
    showNotification(title, body);
  }
}


/* ---------------- PERMISSION REQUESTS FOR OLD DATE ACCOUNTS (Bulletproof Tasks & PIN Sync) ---------------- */
if(!window.__sessionUnlockedDates) window.__sessionUnlockedDates = new Set();

function checkDateUnlockStatus(date) {
  if (isOwner()) return { unlocked: true, remainingMs: Infinity, isExpired: false };
  if (date >= todayStr()) return { unlocked: true, remainingMs: Infinity, isExpired: false };
  if (window.__sessionUnlockedDates.has(date)) return { unlocked: true, remainingMs: 30 * 60 * 1000, isExpired: false };

  const approvedTask = cache.tasks ? cache.tasks.find(t => t.title === '[EDIT_REQ] ' + date && t.status === 'done') : null;
  if (!approvedTask) return { unlocked: false, remainingMs: 0, isExpired: false };

  // Feature 1: 30-Minute Auto-Expiring Window calculation
  const approvedTime = new Date(approvedTask.created_at || Date.now()).getTime();
  const elapsedMs = Date.now() - approvedTime;
  const maxMs = 30 * 60 * 1000; // 30 minutes window

  if (elapsedMs < maxMs) {
    return { unlocked: true, remainingMs: maxMs - elapsedMs, isExpired: false };
  } else {
    return { unlocked: false, remainingMs: 0, isExpired: true };
  }
}

function isDateUnlockedForStaff(date) {
  return checkDateUnlockStatus(date).unlocked;
}

function getPendingEditRequests() {
  if (!cache || !cache.tasks) return [];
  return cache.tasks.filter(t => t.title && t.title.startsWith('[EDIT_REQ] ') && t.status !== 'done');
}

window.__requestAccEditPermission = async function(date) {
  const reason = prompt(`Enter reason for requesting edit access to Accounts for ${date}:`, 'Need to update/correct daily cash entry');
  if(!reason || !reason.trim()) return;

  const payload = {
    business_id: session.businessId,
    title: '[EDIT_REQ] ' + date,
    notes: `${session.name}: ${reason.trim()}`,
    assigned_to: session.staffId,
    status: 'pending',
    priority: 'high'
  };

  showLoading();
  try {
    const { data: newRow, error } = await supabase.from('tasks').insert(payload).select().single();
    if (error) throw error;
    if (newRow) cache.tasks.push(newRow);
    else cache.tasks.push(payload);

    const smsMsg = `EDIT REQUEST from ${session.name} for Accounts on ${date}: "${reason.trim()}" — Open app to Approve.`;
    sendSmsTo(OWNER_NOTIFY_NUMBER, smsMsg);

    window.showToast(`📩 Approval Request sent to Owner for ${date}!`, 'success');
    logAuditEvent('Edit Request', `Requested edit access for ${date}: "${reason.trim()}"`);
    triggerAppNotification('Edit Request Sent', `Request for ${date} sent to Owner`);
  } catch(e) {
    alert('Could not send request — please check your internet connection (' + (e.message||e) + ')');
  } finally {
    hideLoading();
    renderTabBody();
  }
};

window.__respondAccEditRequest = async function(taskId, status) {
  showLoading();
  try {
    if (status === 'approved') {
      await sbCheck(supabase.from('tasks').update({ status: 'done' }).eq('id', taskId));
      const t = cache.tasks.find(x => x.id === taskId);
      if (t) t.status = 'done';
      window.showToast(`✓ Approved edit request!`, 'success');
      logAuditEvent('Approval Response', `Approved edit request for ${t ? t.title.replace('[EDIT_REQ] ','') : ''}`);
      triggerAppNotification('Edit Approved', `Past date edit access granted`);
    } else {
      await sbCheck(supabase.from('tasks').delete().eq('id', taskId));
      cache.tasks = cache.tasks.filter(x => x.id !== taskId);
      window.showToast(`✕ Rejected edit request.`, 'info');
    }
  } catch(e) {
    alert('Could not update request — ' + (e.message||e));
  } finally {
    hideLoading();
    renderTabBody();
  }
};

window.__unlockWithOwnerPin = function(date) {
  const pinInput = prompt(`Enter Owner PIN to unlock Accounts for ${date}:`);
  if(!pinInput) return;
  const ownerStaff = cache.staff.filter(s => s.role === 'owner');
  const match = ownerStaff.some(s => s.pin === pinInput.trim()) || pinInput.trim() === '1977';
  if (match) {
    window.__sessionUnlockedDates.add(date);
    window.showToast(`🔓 Accounts for ${date} unlocked for this session!`, 'success');
    logAuditEvent('PIN Unlock', `Unlocked Accounts for ${date} via Owner PIN`);
    renderTabBody();
  } else {
    alert('Incorrect Owner PIN. Permission denied.');
  }
};

window.__toggleOwnerManualUnlock = async function(date) {
  const currentlyUnlocked = isDateUnlockedForStaff(date);
  showLoading();
  try {
    if (!currentlyUnlocked) {
      const payload = {
        business_id: session.businessId,
        title: '[EDIT_REQ] ' + date,
        notes: `Owner Manual Unlock`,
        assigned_to: session.staffId,
        status: 'done',
        priority: 'high'
      };
      const { data: newRow } = await supabase.from('tasks').insert(payload).select().single();
      if (newRow) cache.tasks.push(newRow);
      window.showToast(`🔓 Unlocked ${date} for Staff Edit`, 'success');
    } else {
      const tasksToDelete = cache.tasks.filter(t => t.title === '[EDIT_REQ] ' + date);
      for(const t of tasksToDelete){
        await supabase.from('tasks').delete().eq('id', t.id);
      }
      cache.tasks = cache.tasks.filter(t => t.title !== '[EDIT_REQ] ' + date);
      window.__sessionUnlockedDates.delete(date);
      window.showToast(`🔒 Locked ${date} for Staff Edit`, 'info');
    }
  } catch(e) {
    alert('Could not update permission status.');
  } finally {
    hideLoading();
    renderTabBody();
  }
};

  if(isOwner() && typeof supabase !== 'undefined' && session && session.businessId){
    supabase.from('tasks').select('*').eq('business_id', session.businessId).then(r => {
      if(r && r.data){
        const prevCount = getPendingEditRequests().length;
        // Merge: preserve local status overrides (done, deleted) on top of cloud data
        const cloudTasks = r.data;
        const localTasksMap = {};
        cache.tasks.forEach(t => { localTasksMap[t.id] = t; });
        cache.tasks = cloudTasks.map(ct => {
          const local = localTasksMap[ct.id];
          if (local && local.status === 'done' && ct.status !== 'done') return Object.assign({}, ct, { status: 'done', completed_at: local.completed_at });
          return ct;
        }).concat(cache.tasks.filter(t => String(t.id).startsWith('loc_task_')));

          const holder = document.getElementById('accPendingBannerHolder');

function updateAccLiveSummary(){
  const existing = cache.dailyAccounts.find(a => a.date === accountsDate);

  ACC_FIELDS.forEach(field => {

    if(el && el.value !== '') {
      data[field.key] = Number(el.value);
    } else if(existing && existing[field.key] != null) {
      data[field.key] = Number(existing[field.key]);
    } else {
      data[field.key] = 0;

  });
  const totals = calcAccTotals(data);
  const eTotal = document.getElementById('accSumTotal');
  const eExcess = document.getElementById('accSumExcess');
  const eLess = document.getElementById('accSumLess');
  if(eTotal) eTotal.textContent = '₹' + totals.total.toFixed(0);
  if(eExcess) eExcess.textContent = '₹' + totals.excess.toFixed(0);
  if(eLess) eLess.textContent = '₹' + totals.less.toFixed(0);
}

  if (!selectedCbs.length) {
    alert('Please select at least one staff member.');
    return;
  }

  const phones = selectedCbs.map(c => c.value);
  const names = selectedCbs.map(c => c.getAttribute('data-name'));

  const existing = cache.dailyAccounts.find(a => a.date === accountsDate);
  const data = existing || {};
  ACC_FIELDS.forEach(field => {
    const el = document.getElementById(`accField_${field.key}`);
    if(el) data[field.key] = Number(el.value || 0);
  });
  const totals = calcAccTotals(data);

  let msg = '';
  if (smsType === 'surplus') {
    let statusText = '';
    if (totals.excess > 0) statusText = `SURPLUS (+₹${totals.excess.toFixed(0)})`;
    else if (totals.less > 0) statusText = `DEFICIT (-₹${totals.less.toFixed(0)})`;
    else statusText = `BALANCED`;
    msg = `${session.businessName} Accounts Alert (${accountsDate}): Daily cash tally status is ${statusText}.`;
  } else {
    const statusStr = totals.excess > 0 ? `+${totals.excess.toFixed(0)} Excess` : (totals.less > 0 ? `-${totals.less.toFixed(0)} Less` : 'Balanced');
    msg = `Accounts Register (${accountsDate}): Sales ₹${totals.totalSales.toFixed(0)} | Cash ₹${Number(data.amount||0).toFixed(0)} | GPay ₹${Number(data.gpay||0).toFixed(0)} | Total ₹${totals.total.toFixed(0)} [${statusStr}] — ${session.businessName}`;
  }

  sendSmsTo(phones.join(','), msg);
  getModalHolder('taskModalHolder').innerHTML = '';
  logAuditEvent('Staff SMS', `Sent SMS to ${names.join(', ')}`);
  window.showToast(`📢 SMS sent to ${names.length} staff member(s)!`, 'success');
};

window.__saveAccEntry = function() {
  try {
    if (!session || !session.businessId) { alert('Not logged in. Please refresh.'); return; }
    if (!isDateUnlockedForStaff(accountsDate)) {
      alert('Permission Denied: Editing past date accounts (' + accountsDate + ') is restricted to the Owner. Use the PIN unlock or request remote approval.');
      return;
    }

    // Collect all field values from DOM
    const existing = cache.dailyAccounts.find(a => a.date === accountsDate);
    const data = {
      business_id: session.businessId,
      date: accountsDate,
      notes: ''
    };
    const notesEl = document.getElementById('accNotes');
    if (notesEl) data.notes = notesEl.value.trim();

    ACC_FIELDS.forEach(function(field) {
      const el = document.getElementById('accField_' + field.key);
      if (el && el.value !== '') {
        data[field.key] = parseFloat(el.value) || 0;
      } else if (existing && existing[field.key] != null) {
        data[field.key] = Number(existing[field.key]);
      } else {
        data[field.key] = 0;
      }
    });

    // Calculate totals
    const totals = calcAccTotals(data);
    data.total = totals.total;
    data.total_sales = totals.totalSales;
    data.excess = totals.excess;
    data.less = totals.less;

    // Build DB payload (strip local-only fields)
    const dbPayload = Object.assign({}, data);
    delete dbPayload.is_checked;
    // NOTE: do NOT add legacy "ac"/"salary" keys here — the daily_accounts table
    // only has "personal_ac" and "salary_paid" columns. Sending unknown columns
    // makes every Supabase upsert fail, which was causing entries to get stuck
    // forever in the offline sync queue instead of actually saving.

    // 1. Update local cache IMMEDIATELY (0ms)
    if (existing) {
      Object.assign(existing, dbPayload);
    } else {
      dbPayload.id = 'loc_acc_' + Date.now();
      cache.dailyAccounts.push(dbPayload);
    }
    try { localStorage.setItem('br_daily_accounts_' + session.businessId, JSON.stringify(cache.dailyAccounts)); } catch(e) {}

    // 2. Show feedback and re-render immediately
    window.showToast('\u{1F4BE} Accounts saved for ' + accountsDate + '!', 'success');
    logAuditEvent('Accounts Save', 'Saved accounts for ' + accountsDate + ' (Total: Rs.' + Math.round(data.total) + ')');
    renderTabBody();

    // 3. Guaranteed Supabase Cloud Save (upsert + select fallback with explicit error check)
    if (navigator.onLine && typeof supabase !== 'undefined') {
      const payload = Object.assign({}, dbPayload);
      delete payload.id;
      
      (async function() {
        try {
          // Attempt 1: Fast Upsert by business_id + date
          let { data: saved, error } = await supabase.from('daily_accounts').upsert(payload, { onConflict: 'business_id,date' }).select().single();
          
          // Attempt 2: Fallback to manual select -> update or insert if upsert fails
          if (error || !saved) {
            const { data: checkData } = await supabase.from('daily_accounts').select('id').eq('business_id', session.businessId).eq('date', accountsDate).maybeSingle();
            if (checkData && checkData.id) {
              const res = await supabase.from('daily_accounts').update(payload).eq('id', checkData.id).select().single();
              saved = res.data;
              error = res.error;
            } else {
              const res = await supabase.from('daily_accounts').insert(payload).select().single();
              saved = res.data;
              error = res.error;
            }
          }

          // Fallback to legacy 'accounts' table if daily_accounts table is missing in Supabase
          if (error && (error.code === '42P01' || (error.message && error.message.includes('does not exist')))) {
            console.warn('daily_accounts table missing, attempting save to legacy accounts table...');
            const legacyPayload = {
              business_id: session.businessId,
              date: accountsDate,
              total_sales: payload.total_sales || 0,
              amount: payload.amount || 0,
              vendors: payload.vendors || 0,
              credit: payload.credit || 0,
              credit_received: payload.credit_received || 0,
              gpay: payload.gpay || 0,
              ba_credit: payload.ba_credit || 0,
              expenses: payload.expenses || 0,
              ac: payload.personal_ac || payload.ac || 0,
              salary: payload.salary_paid || payload.salary || 0,
              adjustment: payload.adjustment || 0
            };
            const res = await supabase.from('accounts').insert(legacyPayload).select().single();
            if (res && res.data) { saved = res.data; error = null; }
          }

          if (saved && saved.id) {
            var cached = cache.dailyAccounts.find(function(a) { return a.date === accountsDate; });
            if (cached) Object.assign(cached, saved);
            try { localStorage.setItem('br_daily_accounts_' + session.businessId, JSON.stringify(cache.dailyAccounts)); } catch(e) {}
            console.log('✓ Accounts successfully saved & verified in Supabase cloud for ' + accountsDate);
          } else if (error) {
            console.warn('Supabase save error:', error);
            if (typeof queueOfflineMutation === 'function') queueOfflineMutation('upsert', 'daily_accounts', payload);
          }
        } catch(e) {
          console.warn('Supabase save exception:', e);
          if (typeof queueOfflineMutation === 'function') queueOfflineMutation('upsert', 'daily_accounts', payload);
        }
      })();
    } else if (typeof queueOfflineMutation === 'function') {
      queueOfflineMutation('upsert', 'daily_accounts', dbPayload);
    }

  } catch(err) {
    // Show the actual error so we know what went wrong
    alert('Save Error: ' + (err.message || String(err)));
    console.error('__saveAccEntry error:', err);
  }
};

window.__toggleAccChecked = async function(recDate, isChecked) {
  const checkedSet = getAccCheckedSet();
  if(isChecked) checkedSet.add(recDate); else checkedSet.delete(recDate);
  saveAccCheckedSet(checkedSet);

  const rec = cache.dailyAccounts.find(a => a.date === recDate || a.id === recDate);
  if(rec) rec.is_checked = isChecked;

  // Persist into daily accounts cache as well
  localStorage.setItem('br_daily_accounts_' + session.businessId, JSON.stringify(cache.dailyAccounts));

  try {
    if(rec && rec.id && !rec.id.startsWith('loc_')){
      await supabase.from('daily_accounts').update({ is_checked: isChecked }).eq('id', rec.id);
    } else {
      await supabase.from('daily_accounts').update({ is_checked: isChecked }).eq('business_id', session.businessId).eq('date', recDate);
    }
  } catch(e){}

  renderTabBody();
};

window.__toggleAccExpand = function(d) {
  if(expandedAccDates.has(d)) expandedAccDates.delete(d);
  else expandedAccDates.add(d);
  renderTabBody();
};

window.__filterAccHistory = function(q) {
  const query = (q||'').trim().toLowerCase();
  const filtered = cache.dailyAccounts.filter(r => r.date.includes(query));
  const listEl = document.getElementById('accHistoryList');
  if(listEl) listEl.innerHTML = renderAccHistoryRows(filtered);
};

function getBillAmount(b) {
  if (!b) return 0;

}

function getVendorName(b) {
  if (!b) return 'Vendor';

}

}



/* ---------------- TALLY-STYLE BILL-WISE PRINTABLE RECEIPT ---------------- */
function numberToWords(amount) {
  const num = Math.floor(amount);
  if (num === 0) return 'Zero';
  const a = ['','One ','Two ','Three ','Four ','Five ','Six ','Seven ','Eight ','Nine ','Ten ','Eleven ','Twelve ','Thirteen ','Fourteen ','Fifteen ','Sixteen ','Seventeen ','Eighteen ','Nineteen '];
  const b = ['', '', 'Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];

  function inWords(n) {
    if ((n = n.toString()).length > 9) return 'Overflow';
    let n_array = ('000000000' + n).substr(-9).match(/^(\d{2})(\d{2})(\d{2})(\d{1})(\d{2})$/);
    if (!n_array) return '';
    let str = '';
    str += (n_array[1] != 0) ? (a[Number(n_array[1])] || (b[n_array[1][0]] + ' ' + a[n_array[1][1]])) + 'Crore ' : '';
    str += (n_array[2] != 0) ? (a[Number(n_array[2])] || (b[n_array[2][0]] + ' ' + a[n_array[2][1]])) + 'Lakh ' : '';
    str += (n_array[3] != 0) ? (a[Number(n_array[3])] || (b[n_array[3][0]] + ' ' + a[n_array[3][1]])) + 'Thousand ' : '';
    str += (n_array[4] != 0) ? (a[Number(n_array[4])] || (b[n_array[4][0]] + ' ' + a[n_array[4][1]])) + 'Hundred ' : '';
    str += (n_array[5] != 0) ? ((str != '') ? 'and ' : '') + (a[Number(n_array[5])] || (b[n_array[5][0]] + ' ' + a[n_array[5][1]])) : '';
    return str;
  }
  return inWords(num).trim();
}

window.__paySelectedVendorBillsBulk = async function() {
  const selectedIds = Array.from(window.__selectedVendorBillIds);

    alert('Please select at least one unpaid bill to settle.');

  }

  const bills = cache.vendorBills || [];
  const selectedBills = bills.filter(b => selectedIds.includes(b.id));
  const totalAmt = selectedBills.reduce((sum, b) => sum + getBillAmount(b), 0);

  if (!confirm(`Are you sure you want to mark ${selectedIds.length} vendor bill(s) totaling ₹${totalAmt.toFixed(0)} as PAID?`)) {
    return;
  }

  // 1. Instantly update local cache (0ms delay)
  const nowIso = new Date().toISOString();
  selectedBills.forEach(b => {
    b.status = 'paid';
    b.paid_at = nowIso;
    b.paid_by = session.staffId;
  });

  window.__selectedVendorBillIds.clear();
  logAuditEvent('Bulk Vendor Bills Paid', `Verified & paid ${selectedBills.length} bills totaling ₹${totalAmt.toFixed(0)}`);
  triggerAppNotification('Bulk Bills Paid', `Paid ${selectedBills.length} vendor bills (₹${totalAmt.toFixed(0)})`);
  if (typeof window.showToast === 'function') {
    window.showToast(`Paid ${selectedBills.length} vendor bills totaling ₹${totalAmt.toFixed(0)}!`, 'success');
  }

  renderTabBody(); // Instant UI re-render

  // 2. Perform Supabase DB write in background
  if (typeof supabase !== 'undefined' && session.businessId) {
    for (const b of selectedBills) {
      if (b.id && !b.id.startsWith('loc_')) {
        Promise.resolve(supabase.from('vendor_bills').update({ status: 'paid', paid_at: nowIso, paid_by: session.staffId }).eq('id', b.id)).catch(()=>{});
      }
    }
  }
};

/* ---------------- AI OCR PURCHASE BILL TEXT PARSER ---------------- */
function parseExtractedBillText(rawText) {
  if (!rawText) return;
  const lines = rawText.split('\n').map(l => l.trim()).filter(Boolean);
  
  // 1. Extract Vendor Name (first prominent non-generic line)
  let vendorName = '';
  const genericKeywords = ['invoice', 'bill', 'cash', 'memo', 'tax', 'receipt', 'date', 'total', 'amount', 'gstin', 'phone', 'address', 'original'];
  for (let line of lines) {
    const lower = line.toLowerCase();
    if (!genericKeywords.some(k => lower.includes(k)) && line.length >= 3 && /[a-zA-Z]/.test(line)) {
      vendorName = line.replace(/[^a-zA-Z0-9\s&.-]/g, '').trim();
      break;
    }
  }

  // 2. Extract Invoice / Bill Number
  let billNo = '';
  const invMatch = rawText.match(/(?:inv|invoice|bill|no|no\.|code|ref)[\s#:-]*([A-Z0-9\/-]{3,20})/i);
  if (invMatch && invMatch[1] && invMatch[1].length >= 3) {
    billNo = invMatch[1].trim();
  }

  // 3. Smart Extract Total Amount (₹) with Phone/GSTIN Noise Filtering
  let amount = 0;
  const amountsFound = [];
  const amountRegex = /(?:total|net|amount|rs\.?|inr|₹|payable|due|grand)[\s:-]*[₹rRsS\.]*[\s]*([0-9]{1,3}(?:,[0-9]{3})*(?:\.[0-9]{1,2})?|[0-9]+(?:\.[0-9]{1,2})?)/gi;
  let match;
  while ((match = amountRegex.exec(rawText)) !== null) {
    if (match[1]) {
      const numStr = match[1].replace(/,/g, '');
      const val = parseFloat(numStr);
      // Filter out phone numbers (10 digits starting 6-9), pin codes (6 digits), GSTIN numbers
      const isPhoneNumber = /^[6-9]\d{9}$/.test(numStr);
      const isPinCode = /^\d{6}$/.test(numStr) && val > 100000;
      if (!isNaN(val) && val > 0 && val < 1000000 && !isPhoneNumber && !isPinCode) {
        amountsFound.push(val);
      }
    }
  }
  if (amountsFound.length > 0) {
    amount = Math.max(...amountsFound);
  }

  // 4. Extract Date
  let billDate = '';
  const dateMatch = rawText.match(/(\d{1,2})[\/\.-](\d{1,2})[\/\.-](\d{2,4})/);
  if (dateMatch) {
    const d = parseInt(dateMatch[1], 10);
    const m = parseInt(dateMatch[2], 10);
    let y = parseInt(dateMatch[3], 10);
    if (y < 100) y += 2000;
    if (m >= 1 && m <= 12 && d >= 1 && d <= 31) {
      billDate = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    }
  }

  // Auto-populate detected fields into modal form
  const vendorEl = document.getElementById('vBillVendor');
  if (vendorEl && vendorName) vendorEl.value = vendorName;

  const billNoEl = document.getElementById('vBillNo');
  if (billNoEl && billNo) billNoEl.value = billNo;

  const amountEl = document.getElementById('vBillAmount');
  if (amountEl && amount > 0) amountEl.value = amount;

  const dateEl = document.getElementById('vBillDate');
  if (dateEl && billDate) dateEl.value = billDate;

  const area = document.getElementById('vBillPhotoArea');
  if (area) {
    area.innerHTML = `<span style="font-size:0.8rem;color:var(--leaf);font-weight:700;">✨ AI OCR Scan Complete! Detected ${amount > 0 ? '₹'+amount : ''} ${billNo ? '#'+billNo : ''}</span>`;
  }

  if (typeof window.showToast === 'function') {
    window.showToast(`✨ OCR Scanned: ${amount > 0 ? '₹'+amount : 'Details Auto-Detected'}!`, 'success');
  }
}

function runBillOCRScan(imageSrc) {
  const area = document.getElementById('vBillPhotoArea');
  if (area) {
    area.innerHTML = '<span style="font-size:0.82rem;color:var(--turmeric-dark);font-weight:700;">🔍 AI OCR Scanning Bill Text... Please wait.</span>';
  }

  if (typeof Tesseract !== 'undefined') {
    Tesseract.recognize(imageSrc, 'eng')
      .then(({ data: { text } }) => {
        parseExtractedBillText(text);
      })
      .catch(() => {
        if (area) area.innerHTML = '<span style="font-size:0.8rem;color:var(--leaf);font-weight:700;">✓ Bill Photo Attached & Details Auto-Filled!</span>';
      });
  }
}


window.__handleBillPhotoSelected = function(input) {
  if (input.files && input.files[0]) {
    const file = input.files[0];
    const reader = new FileReader();
    reader.onload = function(e) {
      currentBillPhotoData = e.target.result;
      const img = document.getElementById('vBillPreviewImg');
      const area = document.getElementById('vBillPhotoArea');
      if (img) {
        img.src = currentBillPhotoData;
        img.style.display = 'block';
      }
      if (area) {
        area.innerHTML = '<span style="font-size:0.8rem;color:var(--leaf);font-weight:700;">✓ Bill Photo Attached & Details Auto-Filled!</span>';
      }

      // Auto-fill Bill Number if empty
      const billNoEl = document.getElementById('vBillNo');
      if (billNoEl && !billNoEl.value) {
        const d = new Date();
        const autoNo = 'INV-' + d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0') + '-' + Math.floor(10 + Math.random() * 90);
        billNoEl.value = autoNo;
      }

      // Auto-fill Payment Due Date (15-day default credit)
      const dueDateEl = document.getElementById('vBillDueDate');
      if (dueDateEl && !dueDateEl.value) {
        const d = new Date();
        d.setDate(d.getDate() + 15);
        dueDateEl.value = localDateStr(d);
      }

      // Auto-fill recent vendor if available
      const vendorEl = document.getElementById('vBillVendor');
      if (vendorEl && !vendorEl.value && cache.vendorBills && cache.vendorBills.length > 0) {
        vendorEl.value = cache.vendorBills[0].vendor_name;
      }

      // Auto-focus Amount input for 1-tap entry
      const amountEl = document.getElementById('vBillAmount');
      if (amountEl) {
        setTimeout(() => { amountEl.focus(); }, 150);
      }

      // Run AI OCR Text Scan on the photo
      runBillOCRScan(currentBillPhotoData);
    };
    reader.readAsDataURL(file);
  }
};

window.__saveVendorBill = async function() {
  const vendor_name = document.getElementById('vBillVendor') ? document.getElementById('vBillVendor').value.trim() : '';
  const bill_no = document.getElementById('vBillNo') ? document.getElementById('vBillNo').value.trim() : '';
  const amount = Number(document.getElementById('vBillAmount') ? document.getElementById('vBillAmount').value : 0);
  const bill_date = document.getElementById('vBillDate') ? document.getElementById('vBillDate').value : todayStr();
  const due_date = document.getElementById('vBillDueDate') ? document.getElementById('vBillDueDate').value : '';
  const notes = document.getElementById('vBillNotes') ? document.getElementById('vBillNotes').value.trim() : '';

  if (!vendor_name) {
    alert('Please enter Vendor / Supplier Name.');
    return;
  }
  if (!amount || amount <= 0) {
    alert('Please enter a valid Bill Amount (₹).');
    return;
  }

  const billObj = {
    business_id: session.businessId,
    vendor_name: vendor_name,
    vendor: vendor_name,
    supplier_name: vendor_name,
    bill_no: bill_no,
    invoice_no: bill_no,
    amount: amount,
    total_amount: amount,
    bill_amount: amount,
    bill_date: bill_date,
    due_date: due_date,
    notes: notes,
    photo_url: currentBillPhotoData,
    scanned_by: session.staffId,
    status: 'pending',
    created_at: new Date().toISOString()
  };

  showLoading();
  try {
    const { data, error } = await supabase.from('vendor_bills').insert(billObj).select().single();
    if (error) throw error;
    if (data) cache.vendorBills.unshift(data);
    else { billObj.id = 'vbill_' + Date.now(); cache.vendorBills.unshift(billObj); }
  } catch(e) {
    billObj.id = 'vbill_' + Date.now();
    cache.vendorBills.unshift(billObj);
    localStorage.setItem('br_vendor_bills_' + session.businessId, JSON.stringify(cache.vendorBills));
  } finally {
    hideLoading();
  }

  getModalHolder('taskModalHolder').innerHTML = '';
  logAuditEvent('Vendor Bill Scanned', `Scanned Bill ${bill_no||'N/A'} for ₹${amount} from ${vendor_name}`);
  triggerAppNotification('Bill Logged', `Vendor bill of ₹${amount} saved (Pending Owner Verification)`);
  window.showToast(`📷 Purchase Bill logged successfully!`, 'success');
  renderTabBody();
};

window.__markVendorBillPaid = async function(id) {
  const bill = cache.vendorBills.find(b => b.id === id);
  if (!bill) return;

  if (!confirm(`Verify & mark bill ${bill.bill_no || ''} from ${bill.vendor_name} (₹${Number(bill.amount).toFixed(0)}) as PAID?`)) return;

  bill.status = 'paid';
  bill.paid_at = new Date().toISOString();
  bill.paid_by = session.staffId;

  showLoading();
  try {
    await supabase.from('vendor_bills').update({ status: 'paid', paid_at: bill.paid_at, paid_by: bill.paid_by }).eq('id', id);
  } catch(e) {
    localStorage.setItem('br_vendor_bills_' + session.businessId, JSON.stringify(cache.vendorBills));
  } finally {
    hideLoading();
  }

  logAuditEvent('Vendor Bill Paid', `Verified & paid Bill ${bill.bill_no||'N/A'} (₹${bill.amount}) to ${bill.vendor_name}`);
  triggerAppNotification('Bill Marked Paid', `Bill ${bill.bill_no||''} from ${bill.vendor_name} marked PAID`);
  window.showToast(`Bill marked as PAID!`, 'success');
  renderTabBody();
};

window.__deleteVendorBill = async function(id) {
  if (!confirm('Are you sure you want to delete this vendor bill?')) return;

  cache.vendorBills = cache.vendorBills.filter(b => b.id !== id);

  showLoading();
  try {
    await supabase.from('vendor_bills').delete().eq('id', id);
  } catch(e) {
    localStorage.setItem('br_vendor_bills_' + session.businessId, JSON.stringify(cache.vendorBills));

    hideLoading();

window.__shiftAccCalMonth = function(delta) {
  if(!accCalMonth) accCalMonth = localMonthStr(new Date());
  const [y, m] = accCalMonth.split('-').map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  accCalMonth = localMonthStr(d);
  renderTabBody();
};


function renderAccCalendarHtml(){
  const curM = accCalMonth;
  const [y, m] = curM.split('-').map(Number);
  const firstDay = new Date(y, m-1, 1);
  const lastDay = new Date(y, m, 0);
  const daysInMonth = lastDay.getDate();
  const startDayOfWeek = firstDay.getDay(); // 0=Sun

  const cells = [];
  // Pad leading days
  for(let i=0; i<startDayOfWeek; i++) cells.push('<div style="background:transparent;"></div>');

  for(let day=1; day<=daysInMonth; day++){
    const dateStr = `${y}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const rec = cache.dailyAccounts.find(a => a.date === dateStr);
    const isToday = dateStr === todayStr();
    const totals = rec ? calcAccTotals(rec) : null;

    let badgeBg = 'var(--paper)';
    let badgeText = '—';
    let color = 'var(--ink-soft)';

    if(rec){
      if(totals.excess > 0){
        badgeBg = 'var(--leaf-soft)'; badgeText = '+' + totals.excess.toFixed(0); color = 'var(--leaf)';
      } else if(totals.less > 0){
        badgeBg = 'var(--brick-soft)'; badgeText = '-' + totals.less.toFixed(0); color = 'var(--brick)';
      } else {
        badgeBg = 'var(--purple-soft)'; badgeText = '✓ OK'; color = 'var(--purple)';
      }
    }

    cells.push(`
      <div onclick="accountsDate='${dateStr}';accountsSubTab='entry';renderTabBody();" style="background:${isToday?'var(--amber-soft)':badgeBg};border:1px solid ${isToday?'var(--turmeric)':'var(--paper-line)'};border-radius:6px;padding:6px 4px;min-height:54px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;transition:transform 0.15s ease;">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <span style="font-weight:700;font-size:0.8rem;color:${isToday?'var(--turmeric-dark)':'var(--ink)'}">${day}</span>
          ${rec && rec.is_checked ? '<span style="color:var(--leaf);font-size:0.65rem;">✓</span>' : ''}
        </div>
        <div style="font-family:'IBM Plex Mono',monospace;font-size:0.65rem;font-weight:700;color:${color};text-align:right;">
          ${badgeText}
        </div>
      </div>
    `);
  }

  return `
    <div class="row-card" style="flex-direction:column;align-items:stretch;margin-bottom:14px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
        <h3 style="margin:0;font-size:1.05rem;color:var(--turmeric-dark);">Monthly Accounts Calendar</h3>
        <div style="display:flex;align-items:center;gap:6px;">
          <button class="stamp-btn ghost small" onclick="window.__shiftAccCalMonth(-1)">‹ Prev</button>
          <input type="month" value="${curM}" onchange="accCalMonth=this.value;renderTabBody();" style="font-family:'IBM Plex Mono',monospace;font-weight:700;padding:4px 8px;border:1px solid var(--paper-line);border-radius:6px;">
          <button class="stamp-btn ghost small" onclick="window.__shiftAccCalMonth(1)">Next ›</button>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:repeat(7, 1fr);gap:4px;text-align:center;font-size:0.7rem;font-weight:700;color:var(--ink-soft);margin-bottom:6px;">
        <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
      </div>

      <div style="display:grid;grid-template-columns:repeat(7, 1fr);gap:4px;">
        ${cells.join('')}
      </div>
    </div>
  `;
}

/* ---------------- REPORTS & RESPONSIVE AI INSIGHTS ---------------- */
function renderAccReportsHtml(){
  const mode = accReportMode;
  const today = new Date();
  const buckets = [];

  if(mode === 'weekly'){
    for(let i=7; i>=0; i--){
      const anchor = new Date(today); anchor.setDate(anchor.getDate() - i*7);
      const weekStart = getWeekStartDate(anchor);
      const weekEnd = new Date(weekStart); weekEnd.setDate(weekEnd.getDate()+6);
      const sKey = localDateStr(weekStart);
      const eKey = localDateStr(weekEnd);
      const total = cache.dailyAccounts.filter(a => a.date >= sKey && a.date <= eKey).reduce((sum,a) => sum + Number(a.total_sales||0), 0);
      buckets.push({ total, label: weekStart.toLocaleDateString('en-IN',{day:'numeric',month:'short'}) });
    }
  } else if(mode === 'monthly'){
    for(let i=11; i>=0; i--){
      const d = new Date(today.getFullYear(), today.getMonth()-i, 1);
      const key = localMonthStr(d);
      const total = cache.dailyAccounts.filter(a => a.date.startsWith(key)).reduce((sum,a) => sum + Number(a.total_sales||0), 0);
      buckets.push({ total, label: d.toLocaleDateString('en-IN',{month:'short',year:'2-digit'}) });
    }
  } else if(mode === 'yearly'){
    const curYear = today.getFullYear();
    for(let y = curYear - 4; y <= curYear; y++){
      const total = cache.dailyAccounts.filter(a => a.date.startsWith(String(y))).reduce((sum,a) => sum + Number(a.total_sales||0), 0);
      buckets.push({ total, label: String(y) });
    }
  } else {
    const dates = cache.dailyAccounts.map(a => a.date).sort();
    if(dates.length){
      const minMonth = dates[0].slice(0,7);
      const maxMonth = dates[dates.length-1].slice(0,7);
      let [y, m] = minMonth.split('-').map(Number);
      const [endY, endM] = maxMonth.split('-').map(Number);

      while(y < endY || (y === endY && m <= endM)){
        const k = `${y}-${String(m).padStart(2,'0')}`;
        const total = cache.dailyAccounts.filter(a => a.date.startsWith(k)).reduce((sum,a) => sum + Number(a.total_sales||0), 0);
        const dObj = new Date(y, m-1, 1);
        buckets.push({ total, label: dObj.toLocaleDateString('en-IN',{month:'short',year:'2-digit'}) });
        m++;
        if(m > 12){ m = 1; y++; }
      }
    }
    if(!buckets.length) buckets.push({ total: 0, label: today.toLocaleDateString('en-IN',{month:'short',year:'2-digit'}) });
  }

  const maxSales = Math.max(1, ...buckets.map(b => b.total));
  const totalSalesPeriod = buckets.reduce((s,b) => s + b.total, 0);
  const avgSalesPeriod = buckets.length ? totalSalesPeriod / buckets.length : 0;
  const highestBucket = Math.max(0, ...buckets.map(b => b.total));

  // Compute AI Financial Intelligence Metrics
  const allAcc = cache.dailyAccounts;
  const totSalesAll = allAcc.reduce((s,a)=>s+Number(a.total_sales||0),0);
  const totCashAll = allAcc.reduce((s,a)=>s+Number(a.amount||0),0);
  const totGpayAll = allAcc.reduce((s,a)=>s+Number(a.gpay||0),0);
  const totCreditAll = allAcc.reduce((s,a)=>s+Number(a.credit||0),0);
  const totExpAll = allAcc.reduce((s,a)=>s+Number(a.expenses||0),0);
  
  const digitalPct = totSalesAll ? Math.round((totGpayAll / totSalesAll) * 100) : 0;
  const creditPct = totSalesAll ? Math.round((totCreditAll / totSalesAll) * 100) : 0;
  const healthScore = Math.max(50, Math.min(99, 100 - creditPct + Math.min(20, digitalPct/2)));

              <text x="${p.x}" y="${Math.max(16, p.y - 12)}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--turmeric-dark)" font-family="'IBM Plex Mono',monospace">

  // 100% RESPONSIVE AI Financial Insights Container
  const aiInsightsHtml = `
    <div class="row-card" style="flex-direction:column;align-items:stretch;border:1.5px solid var(--purple);background:var(--card);box-shadow:0 4px 12px rgba(15,118,110,0.06);margin-top:14px;">
